<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramūnas Vaicekauskas</title>
  <meta name="description" content="Ramūnas Vaicekauskas — portfolio">
  <meta name="robots" content="index,follow" id="meta-robots">
  <link rel="stylesheet" href="https://use.typekit.net/ozo8xwr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <canvas id="vortex" aria-hidden="true"></canvas>
  <div id="bgimg" aria-hidden="true"></div>

  <header class="nav" id="nav"></header>
  <main id="app"></main>

  <!-- Unstacked group overlay -->
  <div class="unstack" id="unstack" aria-hidden="true">
    <div class="unstack__bg"></div>
    <div class="unstack__inner">
      <div class="unstack__head">
        <span class="unstack__num" id="unstack-num"></span>
        <h2 class="unstack__title" id="unstack-title"></h2>
        <button class="unstack__close" id="unstack-close" type="button">Uždaryti ✕</button>
      </div>
      <div class="unstack__grid" id="unstack-grid"></div>
    </div>
  </div>

  <a class="draft-flag" id="draft-flag" href="/admin" hidden>Juodraštis</a>
  <aside class="admin" id="admin" hidden></aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/vortex.js"></script>
  <script src="/js/stacks.js"></script>
  <script src="/js/free.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
